<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Estilos/copia.css">
    <title>Festival</title>
</head>
<body>
    <table border="2">
        <thead>
            <tr>
                <th colspan="4" class="titulo"><b>Festival de Cinema 2026</b></th>
            </tr>
            <tr>
                <th>Categoria</th>
                <th>Filme</th>
                <th>Horário</th>
                <th>Sala</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" class="genero"><b>Ação</b></td>
                <td>Vingadores</td>
                <td>18:00</td>
                <td>1</td>
            </tr>
            <tr class="cinza">
                <td>Batman</td>
                <td>20:30</td>
                <td>2</td>
            </tr>
            <tr>
                <td rowspan="2" class="genero"><b>Animação</b></td>
                <td>Toy Story</td>
                <td>16:00</td>
                <td>3</td>
            </tr>
            <tr class="cinza">
                <td>Frozen</td>
                <td>17:30</td>
                <td>4</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
