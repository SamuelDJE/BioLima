<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>

    <!-- Estrutura da tabela -->
    <table  border="2">
        <!-- Cabeçalho da tabela -->
        <thead>
            <tr><!-- Linha da tabela -->
                <th>Nome</th><!-- Campo/item da tabela -->
                <th>Idade</th><!-- Campo/item da tabela -->
                <th>Cidade</th><!-- Campo/item da tabela -->
            </tr>
        </thead>

        <!-- Corpo da tabela -->
        <tbody>
            <tr>
                <td>Samuel</td><!-- Dados da tabela -->
                <td>18</td><!-- Dados da tabela -->
                <td>Osasco</td><!-- Dados da tabela -->
            </tr>
            <tr>
                <td>Pablo</td>
                <td>39</td>
                <td>Carapicuiba</td>
            </tr>
            <tr>
                <td>Juliana</td>
                <td>18</td>
                <td>Itapevi</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
